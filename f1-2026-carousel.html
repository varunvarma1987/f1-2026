<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 2026 Season Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #000000;
    --white: #FFFFFF;
    --red: #FF3333;
    --gray: #8A8A8A;
    --font-head: 'Space Mono', 'Courier New', monospace;
    --font-body: 'Space Grotesk', 'Helvetica Neue', sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--black); color: var(--white);
    font-family: var(--font-body);
    overflow: hidden;
  }

  ::selection { background: var(--red); color: var(--black); }

  /* ---------- stage ---------- */
  .stage {
    position: relative;
    height: 100%; width: 100%;
    display: flex; align-items: center; justify-content: center;
  }

  #carousel {
    position: relative;
    width: min(460px, 88vw);
    height: min(720px, 90vh);
    perspective: 900px;
  }

  .card {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: var(--white);
    color: var(--black);
    border: 4px solid var(--white);
    box-shadow: 8px 8px 0 0 var(--red);
    transition: transform 0.5s ease, opacity 0.5s ease;
    display: flex; flex-direction: column;
    padding: 34px;
    cursor: pointer;
  }
  .card.center { cursor: default; box-shadow: 12px 12px 0 0 var(--red); }

  .card .meta-row {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; margin-bottom: 18px;
  }

  .card .round-tag {
    font-family: var(--font-head); font-size: 0.85rem; opacity: 0.55;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .card .country {
    font-family: var(--font-head); font-weight: 700; text-transform: uppercase;
    font-size: clamp(2.2rem, 8vw, 3.2rem); line-height: 1.35; margin-bottom: 16px;
    text-wrap: balance;
  }
  .card .country span {
    background: var(--red);
    padding: 4px 14px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }

  .card .title {
    font-size: 1.05rem; font-weight: 500; line-height: 1.35;
    margin-bottom: 6px; opacity: 0.85;
  }

  .card .podium {
    flex: 1;
    min-height: 0;
    border-top: 3px solid var(--black);
    padding-top: 12px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
    scrollbar-width: thin;
    scrollbar-color: transparent transparent;
  }
  .card .podium.scrolling { scrollbar-color: var(--black) transparent; }
  .card .podium::-webkit-scrollbar { width: 8px; }
  .card .podium::-webkit-scrollbar-track { background: transparent; }
  .card .podium::-webkit-scrollbar-thumb { background: transparent; }
  .card .podium.scrolling::-webkit-scrollbar-thumb { background: var(--black); }

  .card .podium .row {
    display: flex; flex-direction: column;
    padding: 12px 0;
    overflow: hidden;
    flex-shrink: 0;
  }

  .card .podium .car-track {
    height: 48px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .card .podium .car-img {
    height: 100%; width: auto;
  }
  .card .podium .row.play .car-img {
    animation: carSlideIn 0.6s cubic-bezier(.2,.7,.3,1) both;
  }

  .card .divider {
    border-top: 3px solid var(--black);
    margin-top: 12px;
  }

  .card .podium .name-line {
    display: flex; align-items: baseline; gap: 12px;
    font-family: var(--font-head); font-size: 1.3rem;
  }
  .card .podium .pos { width: 32px; font-weight: 700; flex-shrink: 0; }
  .card .podium .row:nth-child(1) .pos { color: var(--red); }
  .card .podium .name {
    font-weight: 700; flex: 1; text-transform: uppercase;
    transition: font-size 0.3s ease, opacity 0.15s ease;
    cursor: pointer;
  }
  .card .podium .name:hover { opacity: 0.55; }
  .card .podium .row.highlight .name {
    font-size: 1.7rem;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .card .podium .points {
    font-family: var(--font-head); font-weight: 700; font-size: 1.3rem;
  }
  .card .podium .time {
    font-family: var(--font-head); opacity: 0.55; font-size: 0.85rem;
    margin-top: 2px; padding-left: 44px;
  }

  @keyframes carSlideIn {
    from { transform: translateX(-120%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .card .podium.chart-mode .row { display: none; }
  .card .podium .chart-view { display: none; }
  .card .podium.chart-mode .chart-view {
    display: flex; flex-direction: column;
    flex: 1; min-height: 0;
  }

  .card .chart-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 16px; flex-shrink: 0;
  }
  .card .chart-driver-name {
    font-family: var(--font-head); font-weight: 700; font-size: 1.15rem;
    text-transform: uppercase; letter-spacing: -0.01em;
  }
  .card .chart-close {
    font-family: var(--font-head); font-weight: 700; font-size: 1rem;
    width: 34px; height: 34px; flex-shrink: 0;
    border: 3px solid var(--black); background: var(--white); color: var(--black);
    cursor: pointer;
    box-shadow: 3px 3px 0 0 var(--red);
    transition: transform 100ms steps(2), box-shadow 100ms steps(2);
  }
  .card .chart-close:hover { transform: translate(1px, 1px); box-shadow: 1px 1px 0 0 var(--red); }
  .card .chart-close:active { transform: translate(3px, 3px); box-shadow: none; }

  .card .chart-svg { width: 100%; height: auto; flex: 1; min-height: 0; display: block; }
  .card .chart-bar { fill: var(--black); }
  .card .chart-points { font-family: var(--font-head); font-weight: 700; font-size: 11px; fill: var(--black); text-anchor: middle; }
  .card .chart-circle.podium3 { fill: var(--red); }
  .card .chart-circle.other { fill: var(--black); }
  .card .chart-pos-label { font-family: var(--font-head); font-weight: 700; font-size: 11px; fill: var(--white); text-anchor: middle; dominant-baseline: central; }
  .card .chart-baseline { stroke: var(--black); stroke-width: 3; }

  @media (max-width: 520px) {
    #carousel { width: 86vw; height: 76vh; }
    .card { padding: 24px; }
  }
</style>
</head>

  const POINTS = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];

  function buildDriverHistory() {
    const completedRaces = races.filter(r => r.status === "done" && r.results);

    const driverNames = new Set();
    completedRaces.forEach(r => r.results.forEach(([pos, name]) => driverNames.add(name)));

    const history = {};
    driverNames.forEach(name => {
      history[name] = completedRaces.map(r => {
        const idx = r.results.findIndex(([pos, n]) => n === name);
        if (idx === -1) {
          return { round: r.round, country: r.country, pos: null, points: 0 };
        }
        return {
          round: r.round,
          country: r.country,
          pos: Number(r.results[idx][0]),
          points: POINTS[idx] || 0
        };
      });
    });
    return history;
  }
  const driverHistory = buildDriverHistory();

  function buildChartSVG(entries) {
    const unit = 44;
    const barWidth = 22;
    const plotHeight = 140;
    const marginTop = 24;
    const marginBottom = 46;
    const marginX = 22;
    const width = Math.max(entries.length * unit + marginX * 2, 200);
    const height = marginTop + plotHeight + marginBottom;
    const baselineY = marginTop + plotHeight;

    const bars = entries.map((e, i) => {
      const x = marginX + i * unit + unit / 2;
      const barHeight = (e.points / 25) * plotHeight;
      const barY = baselineY - barHeight;
      const circleY = baselineY + 22;
      const circleClass = e.pos !== null && e.pos <= 3 ? "podium3" : "other";
      const posLabel = e.pos !== null ? e.pos : "–";
      return `
        <text class="chart-points" x="${x}" y="${barY - 8}">${e.points}</text>
        <rect class="chart-bar" x="${x - barWidth / 2}" y="${barY}" width="${barWidth}" height="${barHeight}"></rect>
        <circle class="chart-circle ${circleClass}" cx="${x}" cy="${circleY}" r="12"></circle>
        <text class="chart-pos-label" x="${x}" y="${circleY}">${posLabel}</text>
      `;
    }).join("");

    return `
      <svg class="chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">
        <line class="chart-baseline" x1="${marginX}" y1="${baselineY}" x2="${width - marginX}" y2="${baselineY}"></line>
        ${bars}
      </svg>
    `;
  }

  function showDriverChart(cardEl, name) {
    const podiumEl = cardEl.querySelector(".podium");
    if (!podiumEl) return;
    const entries = driverHistory[name] || [];

    let chartView = podiumEl.querySelector(".chart-view");
    if (!chartView) {
      chartView = document.createElement("div");
      chartView.className = "chart-view";
      podiumEl.appendChild(chartView);
    }
    chartView.innerHTML = `
      <div class="chart-header">
        <span class="chart-driver-name">${name}</span>
        <button class="chart-close" aria-label="Back to results">&times;</button>
      </div>
      ${buildChartSVG(entries)}
    `;
    chartView.querySelector(".chart-close").addEventListener("click", (e) => {
      e.stopPropagation();
      podiumEl.classList.remove("chart-mode");
    });

    podiumEl.classList.add("chart-mode");
  }

  const carousel = document.getElementById("carousel");

  let currentIndex = races.map(r => r.status).lastIndexOf("done");
  if (currentIndex === -1) currentIndex = 0;

  function cardHTML(r, i) {
    const results = r.results
      ? `<div class="podium">${r.results.map(([pos, name, team, time], idx) => {
            const car = teamCars[team] || "";
            const points = POINTS[idx] || 0;
            const nameParts = name.trim().split(/\s+/);
            const lastName = nameParts.pop();
            const firstName = nameParts.join(" ");
            return `
            <div class="row">
              <div class="car-track">${car ? `<img class="car-img" src="${car}" alt="${name} car" style="animation-delay:${(idx * 0.15).toFixed(2)}s">` : ""}</div>
              <div class="name-line">
                <span class="pos">${pos}</span>
                <span class="name" data-full="${name}"><span class="first">${firstName}</span> <span class="last">${lastName}</span></span>
                <span class="points">${points}</span>
              </div>
              <div class="time">${time}</div>
            </div>`;
          }).join("")}</div>`
      : `<div class="divider"></div>`;

    return `
      <div class="meta-row">
        <span class="round-tag">2026 &nbsp;${r.round} / ${races.length}</span>
        <span class="round-tag">${r.date}</span>
      </div>
      <div class="country"><span>${r.country}</span></div>
      <div class="title">${r.title}</div>
      ${results}
    `;
  }

  function createCards() {

      el.addEventListener("click", () => {
        const idx = races.indexOf(r);

      const podiumEl = el.querySelector(".podium");
      if (podiumEl) {

        podiumEl.addEventListener("scroll", () => {
          podiumEl.classList.add("scrolling");

          scrollTimer = setTimeout(() => podiumEl.classList.remove("scrolling"), 700);
          setHighlightRow(topRowOf(podiumEl));
        });
        setHighlightRow(podiumEl.querySelector(".row"));
        podiumEl.addEventListener("click", (e) => {
          const nameEl = e.target.closest(".name");
          if (!nameEl || !el.classList.contains("center")) return;
          e.stopPropagation();
          showDriverChart(el, nameEl.dataset.full);
        });
      }
      carousel.appendChild(el);
    });
    updateCards();
  }

  function topRowOf(podiumEl) {
    const rows = podiumEl.querySelectorAll(".row");
    if (!rows.length) return null;
    const podiumTop = podiumEl.getBoundingClientRect().top;
    let target = rows[0];
    for (const row of rows) {
      if (row.getBoundingClientRect().top - podiumTop <= 80) target = row;
      else break;
    }
    return target;
  }

  function setHighlightRow(row) {
    if (!row) return;
    const podiumEl = row.closest(".podium");
    const current = podiumEl.querySelector(".row.highlight");
    if (current === row) return;
    if (current) current.classList.remove("highlight");
    row.classList.add("highlight");
  }

  /* -- carousel scroll/stack math, adapted from the source project's script.js -- */
  function updateCards() {
    const cardWidth = 300;
    const cardSpacing = 100;
    const adjacentCardScale = 0.5;
    const farCardScale = 0.4;
    const cards = carousel.children;

    for (let i = 0; i < cards.length; i++) {
      const card = cards[i];
      const offset = i - currentIndex;
      let translateX, translateZ, rotateY, scale;

      if (offset === 0) {
        translateX = 0; translateZ = 0; rotateY = 0; scale = 1;
        card.className = "card center";
        playPodiumAnimation(card);
      } else {
        const absOffset = Math.abs(offset);
        const direction = offset < 0 ? -1 : 1;
        if (absOffset === 1) {
          translateX = direction * (cardWidth / 2 + cardSpacing);
          scale = adjacentCardScale;
        } else {
          translateX = direction * (cardWidth / 2 + cardSpacing + (absOffset - 1) * (cardWidth * adjacentCardScale + cardSpacing));
          scale = farCardScale;
        }
        translateZ = -100 * absOffset;
        rotateY = direction * -15;
        card.className = "card";
      }

      card.style.transform = `translateX(${translateX}px) translateZ(${translateZ}px) rotateY(${rotateY}deg) scale(${scale})`;
      card.style.opacity = Math.abs(offset) > 2 ? 0 : 1;
      card.style.zIndex = 1000 - Math.abs(offset);
      card.style.pointerEvents = Math.abs(offset) > 2 ? "none" : "auto";
    }

  }

  function playPodiumAnimation(card) {
    const rows = card.querySelectorAll(".podium .row");
    rows.forEach(row => {
      row.classList.remove("play");
      void row.offsetWidth; // force reflow so the animation restarts
      row.classList.add("play");
    });
  }

  function goTo(index) {
    if (index < 0 || index > races.length - 1) return;
    currentIndex = index;
    updateCards();
  }

  let scrollAccumulator = 0;
  const scrollThreshold = 105;

  function handleWheel(event) {
    event.preventDefault();
    scrollAccumulator += Math.abs(event.deltaY);
    if (scrollAccumulator >= scrollThreshold) {
      scrollAccumulator = 0;
      if (event.deltaY > 0) goTo(currentIndex + 1);
      else if (event.deltaY < 0) goTo(currentIndex - 1);
    }
  }

  createCards();

  document.addEventListener("wheel", handleWheel, { passive: false });

  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") goTo(currentIndex + 1);
    if (e.key === "ArrowLeft") goTo(currentIndex - 1);
  });

  /* touch swipe for mobile */
  let touchStartX = 0;
  document.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) < 40) return;
    if (dx < 0) goTo(currentIndex + 1);
    else goTo(currentIndex - 1);
  }, { passive: true });
</script>
</body>
</html>
